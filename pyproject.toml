[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-reset-kit"
version = "0.1.0"
description = "Local trial/state reset toolkit for desktop apps (CrossOver, Parallels, …) with launch hooks and agent-friendly CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "trial-reset-kit contributors" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
trialreset = "trialreset.cli:main"

[tool.setuptools]
packages = ["trialreset", "trialreset.adapters"]
